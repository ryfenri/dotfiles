[dock]
enabled = false

[hooks]
battery_charging = "noctalia msg power-set balanced"
battery_discharging = "noctalia msg power-set power-saver"
session_locked = "noctalia msg media pause"
shutting_down = "toggle_server"
started = "noctalia msg plugin yuuto/arch-updater:service all check"
