config_version = 16

[bar]
order = [ "bottom", "main", "top", "right" ]

    [bar.bottom]
    center = []
    enabled = true
    end = []
    margin_ends = 0
    position = "bottom"
    start = []
    thickness = 16

    [bar.main]
    center = [ "clock", "date", "widget" ]
    end = [ "recorder", "media", "power_profile", "network", "volume", "brightness", "battery" ]
    margin_ends = 0
    position = "left"
    start = [ "spacer_2", "workspaces", "tray", "keyboard_layout" ]
    thickness = 42

    [bar.right]
    center = []
    enabled = true
    end = []
    margin_ends = 0
    position = "right"
    start = []
    thickness = 16

        [bar.right.dead_zone.actions]
        left = "panel-toggle control-center audio"
        right = "none"

    [bar.top]
    center = []
    enabled = true
    end = []
    margin_ends = 0
    start = []
    thickness = 16

        [bar.top.dead_zone.actions]
        middle = "panel-toggle control-center system"
        right = "none"

[control_center]
hidden_tabs = [ "screen-time" ]
show_avatar_border = false
show_session_button = false
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 128.0
    box_width = 352.0
    cx = 256.0
    cy = 940.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        bands = 32
        centered = true
        color_1 = "on_primary"
        color_2 = "primary"
